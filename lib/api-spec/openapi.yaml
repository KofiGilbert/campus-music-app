            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artist"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /artists/{id}:
    get:
      operationId: getArtistById
      tags: [artists]
      summary: Get a single artist by ID
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Artist detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateArtist
      tags: [artists]
      summary: Update an artist's profile (owner only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArtistBody"
      responses:
        "200":
          description: Updated artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the artist owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /artists/{id}/follow:
    post:
      operationId: followArtist
      tags: [artists]
      summary: Follow or unfollow an artist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowBody"
      responses:
        "200":
          description: Updated follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get a user's public profile including their tracks
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/search:
    get:
      operationId: searchConnections
      tags: [connections]
      summary: Search registered users by name or university
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: true
          description: Search query (matched against name and university)
      responses:
        "200":
          description: Matching users with connection status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections:
    get:
      operationId: getConnections
      tags: [connections]
      summary: Get user connections
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [discover, friends, requests, sent]
          required: false
      responses:
        "200":
          description: Connection list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/{userId}/connect:
    post:
      operationId: sendConnectionRequest
      tags: [connections]
      summary: Send or withdraw a connection request to a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectBody"
      responses:
        "200":
          description: Connection request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /playback:
    get:
      operationId: getPlaybackState
      tags: [tracks]
      summary: Get the saved playback state for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved playback state (null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: savePlaybackState
      tags: [tracks]
      summary: Save the current playback position for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackStateBody"
      responses:
        "200":
          description: Playback state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackState"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/{userId}/respond:
    post:
      operationId: respondToConnectionRequest
      tags: [connections]
      summary: Accept or decline an incoming connection request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondBody"
      responses:
        "200":
          description: Response result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespondResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [listener, artist]
        university:
          type: string
        country:
          type: string
      required:
        - email
        - password
        - name
        - role
        - university
        - country

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Legacy alias for accessToken; removed once clients migrate.
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - accessToken
        - refreshToken
        - user

    RefreshBody:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken

    RefreshResponse:
      type: object
      properties:
        token:
          type: string
          description: Legacy alias for accessToken.
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - token
        - accessToken
        - refreshToken

    LogoutResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ForgotPasswordBody:
      type: object
      properties:
        email:
          type: string
      required:
        - email

    ForgotPasswordResponse:
      type: object
      properties:
        sent:
          type: boolean
      required:
        - sent

    ResetPasswordBody:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
      required:
        - token
        - newPassword

    ResetPasswordResponse:
      type: object
      properties:
        reset:
          type: boolean
      required:
        - reset

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [listener, artist]
        university:
          type: string
        country:
          type: string
        avatarUrl:
          type: string
          nullable: true
        avatarUrls:
          type: ["object", "null"]
          additionalProperties:
            type: string
        emailVerified:
          type: boolean
      required:
        - id
        - email
        - name
        - role
        - university
        - country
        - emailVerified

    LikeBody:
      type: object
      properties:
        liked:
          type: boolean

    LikeResponse:
      type: object
      properties:
        trackId:
          type: string
        likes:
          type: integer
        liked:
          type: boolean
      required:
        - trackId
        - likes
        - liked

    LibraryBody:
      type: object
      properties:
        saved:
          type: boolean

    LibraryResponse:
      type: object
      properties:
        trackId:
          type: string
        saved:
          type: boolean
      required:
        - trackId
        - saved

    FollowBody:
      type: object
      properties:
        following:
          type: boolean

    FollowResponse:
      type: object
      properties:
        artistId:
          type: string
        followerCount:
          type: integer
        following:
          type: boolean
      required:
        - artistId
        - followerCount
        - following

    Track:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        artistId:
          type: string
        genre:
          type: string
        duration:
          type: string
        durationSeconds:
          type: integer
        coverColor:
          type: string
        audioUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        playCount:
          type: integer
        likes:
          type: integer
        university:
          type: ["string", "null"]
        audioUrls:
          type: ["object", "null"]
          additionalProperties:
            type: string
        coverUrls:
          type: ["object", "null"]
          additionalProperties:
            type: string
        stemUrls:
          type: ["object", "null"]
          additionalProperties:
            type: string
        processingStatus:
          type: string
          enum: [pending, processing, ready, failed]
      required:
        - id
        - title
        - artist
        - artistId
        - genre
        - duration
        - durationSeconds
        - coverColor
        - audioUrl
        - coverUrl
        - playCount
        - likes
        - university

    PostAuthor:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
      required:
        - id
        - username
        - name
        - role

    Post:
      type: object
      properties:
        id:
          type: string
        author:
          oneOf:
            - $ref: "#/components/schemas/PostAuthor"
            - type: "null"
        body:
          type: string
        type:
          type: string
          enum: [original, repost, quote]
        attachedTrack:
          oneOf:
            - $ref: "#/components/schemas/Track"
            - type: "null"
        attachedImageUrl:
          type: ["string", "null"]
        originalPost:
          oneOf:
            - $ref: "#/components/schemas/Post"
            - type: "null"
        likeCount:
          type: integer
        commentCount:
          type: integer
        shareCount:
          type: integer
        repostCount:
          type: integer
        hasLiked:
          type: ["boolean", "null"]
        hasReposted:
          type: ["boolean", "null"]
        createdAt:
          type: string
      required:
        - id
        - body
        - type
        - likeCount
        - commentCount
        - shareCount
        - repostCount
        - createdAt

    FeedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: ["string", "null"]
      required:
        - items
        - nextCursor

    CreatePostBody:
      type: object
      properties:
        body:
          type: string
        attachedTrackId:
          type: string
        attachedImageUrl:
          type: string
        type:
          type: string
          enum: [original, repost, quote]
        originalPostId:
          type: string

    CommentAuthor:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
      required:
        - id
        - username
        - name

    Comment:
      type: object
      properties:
        id:
          type: string
        author:
          oneOf:
            - $ref: "#/components/schemas/CommentAuthor"
            - type: "null"
        body:
          type: string
        parentCommentId:
          type: ["string", "null"]
        replyCount:
          type: integer
        likeCount:
          type: integer
        hasLiked:
          type: ["boolean", "null"]
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        createdAt:
          type: string
      required:
        - id
        - body
        - replyCount
        - likeCount
        - replies
        - createdAt

    CommentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        nextCursor:
          type: ["string", "null"]
      required:
        - items
        - nextCursor

    CreateCommentBody:
      type: object
      properties:
        targetType:
          type: string
          enum: [post, track]
        targetId:
          type: string
        body:
          type: string
        parentCommentId:
          type: string
      required:
        - body

    LikeToggleResponse:
      type: object
      properties:
        liked:
          type: boolean
        likeCount:
          type: integer
      required:
        - liked
        - likeCount

    ShareBody:
      type: object
      properties:
        platform:
          type: string

    ShareResponse:
      type: object
      properties:
        shareCount:
          type: integer
        deepLink:
          type: string
      required:
        - shareCount
        - deepLink

    MessageSender:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
      required:
        - id
        - username
        - name
        - role

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        sender:
          oneOf:
            - $ref: "#/components/schemas/MessageSender"
            - type: "null"
        body:
          type: string
        attachedTrack:
          oneOf:
            - $ref: "#/components/schemas/Track"
            - type: "null"
        attachedImageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - conversationId
        - body
        - createdAt

    MessagesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: ["string", "null"]
      required:
        - items
        - nextCursor

    ConversationSummary:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/MessageSender"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unreadCount:
          type: integer
        lastMessageAt:
          type: string
      required:
        - id
        - type
        - participants
        - unreadCount
        - lastMessageAt

    ConversationsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        nextCursor:
          type: ["string", "null"]
      required:
        - items
        - nextCursor

    CreateConversationBody:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId

    SendMessageBody:
      type: object
      properties:
        body:
          type: string
        attachedTrackId:
          type: string
        attachedImageUrl:
          type: string

    MarkReadResponse:
      type: object
      properties:
        ok:
          type: boolean
        lastReadAt:
          type: string
      required:
        - ok
        - lastReadAt

    LiveHost:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
      required:
        - id
        - username
        - name
        - role

    LiveSession:
      type: object
      properties:
        id:
          type: string
        host:
