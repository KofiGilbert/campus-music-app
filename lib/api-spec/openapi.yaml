      required:
        - count

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    NotifPrefsResponse:
      type: object
      properties:
        prefs:
          type: object
          additionalProperties:
            type: boolean
      required:
        - prefs

    NotifPrefsBody:
      type: object
      properties:
        prefs:
          type: object
          additionalProperties:
            type: boolean
      required:
        - prefs

    RegisterPushTokenBody:
      type: object
      properties:
        token:
          type: string
        platform:
          type: string
      required:
        - token

    UnregisterPushTokenBody:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    Artist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        genre:
          type: string
        university:
          type: ["string", "null"]
        coverColor:
          type: string
        avatarUrl:
          type: ["string", "null"]
        followerCount:
          type: integer
        bio:
          type: ["string", "null"]
        following:
          type: boolean
          description: Whether the authenticated user follows this artist. Omitted when unauthenticated.
      required:
        - id
        - name
        - genre
        - university
        - coverColor
        - avatarUrl
        - followerCount
        - bio

    SearchUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        university:
          type: ["string", "null"]
        role:
          type: string
      required:
        - id
        - username
        - name
        - role

    SearchResults:
      type: object
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        users:
          type: array
          items:
            $ref: "#/components/schemas/SearchUser"
        universities:
          type: array
          items:
            type: string
      required:
        - tracks
        - artists

    NowListeningItem:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SearchUser"
        track:
          $ref: "#/components/schemas/Track"
        playedAt:
          type: string
      required:
        - user
        - track
        - playedAt

    NowListeningResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NowListeningItem"
      required:
