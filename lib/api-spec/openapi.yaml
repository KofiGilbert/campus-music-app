        - name
        - role

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        actor:
          oneOf:
            - $ref: "#/components/schemas/NotificationActor"
            - type: "null"
        targetType:
          type: ["string", "null"]
        targetId:
          type: ["string", "null"]
        body:
          type: ["string", "null"]
        readAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - type
        - createdAt

    NotificationsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: ["string", "null"]
      required:
        - items
        - nextCursor

    UnreadCountResponse:
      type: object
      properties:
        count:
