    LiveTokenResponse:
      type: object
      properties:
        token:
          type: string
        wsUrl:
          type: ["string", "null"]
        room:
          type: string
        role:
          type: string
          enum: [host, listener]
      required:
        - token
        - room
        - role

    ListenerCountResponse:
      type: object
      properties:
        listenerCount:
          type: integer
      required:
        - listenerCount

    LiveChatUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
      required:
        - id
        - name

    LiveChatMessage:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        user:
          $ref: "#/components/schemas/LiveChatUser"
        body:
          type: string
        createdAt:
          type: string
