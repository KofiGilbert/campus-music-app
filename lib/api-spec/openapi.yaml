            - $ref: "#/components/schemas/LiveHost"
            - type: "null"
        title:
          type: string
        status:
          type: string
          enum: [live, ended]
        transport:
          type: string
        listenerCount:
          type: integer
        peakListenerCount:
          type: integer
        recordingTrackId:
          type: ["string", "null"]
        startedAt:
          type: string
        endedAt:
          type: ["string", "null"]
      required:
        - id
        - title
        - status
        - transport
        - listenerCount
        - peakListenerCount
        - startedAt

    LiveSessionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveSession"
      required:
        - items

    CreateLiveSessionBody:
      type: object
      properties:
        title:
