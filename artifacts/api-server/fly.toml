# Fly.io config for the Campus Music API.
# Multi-region: primary iad; add lax with `fly regions add lax` +
# `fly scale count 2 --region iad,lax`.
#
# Secrets are set with `fly secrets set` (NEVER committed): DATABASE_URL,
# JWT_SECRET, R2_* (and later LIVEKIT_*, RESEND_API_KEY, etc.). See .env.example.
#
# NOTE (Phase 0): not yet deployed — the Fly app has no payment method (Kofi to
# add a card). This is reviewed IaC; `fly deploy` runs once billing is enabled.

app = "campus-music-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Persistent for the Socket.io gateway (DEVIN_ROADMAP §3.4 / §3.7).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
