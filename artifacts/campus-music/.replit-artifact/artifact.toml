kind = "web"
previewPath = "/"
title = "Campus Music"
version = "1.0.0"
id = "artifacts/campus-music"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20253

[services.development]
run = "pnpm --filter @workspace/campus-music run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-music", "run", "build" ]
publicDir = "artifacts/campus-music/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20253"
BASE_PATH = "/"
